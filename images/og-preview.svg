<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4c1d95"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80"  r="180" fill="white" fill-opacity="0.05"/>
  <circle cx="100"  cy="550" r="150" fill="white" fill-opacity="0.05"/>
  <circle cx="600"  cy="620" r="100" fill="white" fill-opacity="0.04"/>

  <!-- Icon box -->
  <rect x="80" y="80" width="100" height="100" rx="24" fill="white" fill-opacity="0.2"/>
  <text x="130" y="150" font-size="52" text-anchor="middle" fill="white">📱</text>

  <!-- Main Title -->
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white">DigiSakhi</text>

  <!-- Subtitle -->
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="38" fill="rgba(255,255,255,0.9)">Digital Empowerment for Women</text>

  <!-- Description -->
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.75)">Free digital literacy for Women Self-Help Groups</text>
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.75)">Smartphone • Online Safety • Social Media • Helplines</text>

  <!-- Bottom strip -->
  <rect x="0" y="555" width="1200" height="75" fill="rgba(0,0,0,0.25)"/>
  <text x="80"  y="603" font-family="Arial, sans-serif" font-size="26" fill="#fde68a" font-weight="bold">Women Helpline: 1091</text>
  <text x="420" y="603" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.6)">|</text>
  <text x="450" y="603" font-family="Arial, sans-serif" font-size="26" fill="#fde68a" font-weight="bold">Cyber Crime: 1930</text>
  <text x="750" y="603" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.6)">|</text>
  <text x="780" y="603" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.8)">digisakhi-2026.netlify.app</text>
</svg>
